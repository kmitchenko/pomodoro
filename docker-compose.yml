services:
  postgres:
    image: postgres:18-alpine
    container_name: pomodoro-postgres
    environment:
      POSTGRES_USER: pomodoro
      POSTGRES_PASSWORD: pomodoro
      POSTGRES_DB: pomodoro
    ports:
      - '5433:5432' # host 5433 → avoids clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pomodoro -d pomodoro']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
